name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily FinOps analysis at 08:00 UTC on weekdays
    - cron: "0 8 * * 1-5"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests with moto (mocked AWS)
        run: uv run pytest tests/ -v --tb=short
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1
          ANTHROPIC_API_KEY: test-key

      - name: Lint
        run: uv run ruff check src/ tests/

  daily-analysis:
    name: Daily FinOps Analysis
    runs-on: ubuntu-latest
    # Only run on schedule, not on push/PR
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_FINOPS_ROLE_ARN }}

      - name: Run daily analysis and post to Slack
        run: uv run finops analyze --slack --top 10
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Generate executive report
        run: uv run finops report --output executive-summary.md
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: finops-report-${{ github.run_number }}
          path: executive-summary.md
          retention-days: 30
