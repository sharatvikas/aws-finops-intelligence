[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aws-finops-intelligence"
version = "0.1.0"
description = "AI-driven AWS cost intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.30.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "click>=8.1.0",
    "pydantic>=2.7.0",
    "structlog>=24.1.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "slack-sdk>=3.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "moto[ec2,rds,s3,ce]>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
finops = "finops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/finops"]
